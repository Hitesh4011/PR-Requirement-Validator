name: PR Ticket Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-pr:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3. Install automation dependencies
      - name: Install Dependencies
        run: |
          pip install -r .github/requirements.txt

      # 4. Fetch base branch (important for diff)
      - name: Fetch Base Branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

      # 5. Generate diff file
      - name: Generate Diff
        run: |
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > diff.txt

      # 6. Run main automation script
      - name: Run Validation Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIRA_API_KEY: ${{ secrets.JIRA_API_KEY }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BRANCH_NAME: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python .github/scripts/main.py